<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nastavení — Foto Koutek</title>
  <script src="/tailwind.min.js"></script>
  <style>
    body { background: #1a1a2e; font-family: Georgia, serif; color: #f1f1f1; }
    .gold { color: #d4af37; }
    .section { background: #111827; border-radius: 0.5rem; padding: 1.25rem; margin-bottom: 1rem; }
    .section-title { color: #d4af37; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 1rem; display: block; }
    .field-label { display: block; font-size: 0.7rem; color: #9ca3af; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.25rem; }
    .field-input { background: #000; border: 1px solid #374151; color: #fff; border-radius: 0.375rem; padding: 0.5rem 0.75rem; font-size: 0.875rem; width: 100%; outline: none; box-sizing: border-box; }
    .field-input:focus { border-color: #ca8a04; }
    /* Custom select wrapper */
    .custom-select-wrap { position: relative; flex: 1; }
    .custom-select-display {
      background: #000; border: 1px solid #374151; color: #fff; border-radius: 0.375rem;
      padding: 0.5rem 2rem 0.5rem 0.75rem; font-size: 0.875rem; width: 100%;
      cursor: pointer; user-select: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      box-sizing: border-box;
    }
    .custom-select-display:after {
      content: "▾"; position: absolute; right: 0.6rem; top: 50%; transform: translateY(-50%);
      color: #9ca3af; pointer-events: none;
    }
    .custom-select-dropdown {
      display: none; position: absolute; top: calc(100% + 2px); left: 0; right: 0; z-index: 50;
      background: #1f2937; border: 1px solid #d4af37; border-radius: 0.375rem;
      max-height: 200px; overflow-y: auto;
    }
    .custom-select-dropdown.open { display: block; }
    .custom-select-option {
      padding: 0.5rem 0.75rem; font-size: 0.875rem; cursor: pointer; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .custom-select-option:hover { background: #374151; }
    .custom-select-option.selected { color: #d4af37; background: #1e2d1e; }
    /* Refresh button */
    .btn-refresh {
      border: 1px solid #d4af37; color: #d4af37; border-radius: 0.375rem;
      padding: 0.5rem 0.75rem; font-size: 0.75rem; cursor: pointer; white-space: nowrap;
      background: transparent;
    }
    .btn-refresh:hover { opacity: 0.75; }
    /* Log box */
    .log-line { font-family: monospace; font-size: 11px; white-space: pre-wrap; word-break: break-all; line-height: 1.5; }
    .log-WARNING { color: #facc15; }
    .log-ERROR   { color: #f87171; }
    .log-INFO    { color: #d1d5db; }
    .log-DEBUG   { color: #6b7280; }
  </style>
</head>
<body class="min-h-screen">

  <header class="text-center py-5 border-b border-yellow-700 mb-6">
    <h1 class="text-2xl tracking-widest gold">NASTAVENÍ</h1>
    <p class="text-xs text-gray-500 mt-1">FOTO KOUTEK — Eliška &amp; Tom 2026</p>
    <a href="/" class="text-xs text-gray-600 hover:text-yellow-600 mt-1 inline-block">← zpět do galerie</a>
  </header>

  <div class="max-w-2xl mx-auto px-4 pb-12">

    <div id="banner" class="hidden rounded px-4 py-2 mb-4 text-sm text-center"></div>

    <!-- Printer -->
    <div class="section">
      <span class="section-title">🖨 Tiskárna</span>
      <label class="field-label">Název tiskárny</label>
      <div class="flex gap-2 items-center">
        <div class="custom-select-wrap" id="printer-wrap">
          <div class="custom-select-display" id="printer-display" onclick="toggleDropdown('printer')">Načítám…</div>
          <div class="custom-select-dropdown" id="printer-dropdown"></div>
        </div>
        <button class="btn-refresh" onclick="loadPrinters()">↺ Obnovit</button>
      </div>
    </div>

    <!-- Camera -->
    <div class="section">
      <span class="section-title">📷 Fotoaparát (MTP)</span>
      <label class="field-label">Zařízení</label>
      <div class="flex gap-2 items-center mb-3">
        <div class="custom-select-wrap" id="camera-device-wrap">
          <div class="custom-select-display" id="camera-device-display" onclick="toggleDropdown('camera-device')">Načítám…</div>
          <div class="custom-select-dropdown" id="camera-device-dropdown"></div>
        </div>
        <button class="btn-refresh" onclick="loadMtpDevices()">↺ Obnovit</button>
      </div>
      <label class="field-label">Složka ve fotoaparátu (DCIM)</label>
      <div class="flex gap-2 items-center mb-3">
        <div class="custom-select-wrap" id="camera-folder-wrap">
          <div class="custom-select-display" id="camera-folder-display" onclick="toggleDropdown('camera-folder')">— vyberte zařízení —</div>
          <div class="custom-select-dropdown" id="camera-folder-dropdown"></div>
        </div>
        <button class="btn-refresh" onclick="loadMtpFolders()">↺ Složky</button>
      </div>
      <button onclick="restartNikon()" style="border:1px solid #a16207;color:#d4af37;border-radius:0.375rem;padding:0.5rem 1rem;font-size:0.75rem;cursor:pointer;background:transparent;width:100%;">
        ↺ Restartovat připojení k fotoaparátu
      </button>
      <p id="nikon-status" class="text-xs text-gray-600 mt-2 text-center"></p>
    </div>

    <!-- SMTP / IMAP -->
    <div class="section">
      <span class="section-title">✉ E-mail (SMTP / IMAP)</span>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="field-label">SMTP server</label>
          <input class="field-input" id="SMTP_SERVER" type="text" placeholder="smtp.seznam.cz">
        </div>
        <div>
          <label class="field-label">SMTP port</label>
          <input class="field-input" id="SMTP_PORT" type="text" placeholder="465">
        </div>
        <div>
          <label class="field-label">SMTP uživatel</label>
          <input class="field-input" id="SMTP_USER" type="text" placeholder="foto@example.cz">
        </div>
        <div>
          <label class="field-label">SMTP heslo</label>
          <input class="field-input" id="SMTP_PASS" type="password" placeholder="app-specific password">
        </div>
        <div>
          <label class="field-label">IMAP server</label>
          <input class="field-input" id="IMAP_SERVER" type="text" placeholder="imap.seznam.cz">
        </div>
        <div>
          <label class="field-label">IMAP interval (s)</label>
          <input class="field-input" id="IMAP_POLL_INTERVAL" type="text" placeholder="30">
        </div>
        <div>
          <label class="field-label">IMAP uživatel</label>
          <input class="field-input" id="IMAP_USER" type="text" placeholder="foto@example.cz">
        </div>
        <div>
          <label class="field-label">IMAP heslo</label>
          <input class="field-input" id="IMAP_PASS" type="password" placeholder="app-specific password">
        </div>
      </div>
    </div>

    <!-- Photo folders -->
    <div class="section">
      <span class="section-title">📁 Složky fotografií</span>
      <div style="display:grid;gap:0.75rem;">
        <div><label class="field-label">Vstupní složka (camera)</label><input class="field-input" id="CAMERA_DIR" type="text"></div>
        <div><label class="field-label">Záloha originálů (raw)</label><input class="field-input" id="RAW_DIR" type="text"></div>
        <div><label class="field-label">Zpracované fotografie (processed)</label><input class="field-input" id="PROCESSED_DIR" type="text"></div>
        <div><label class="field-label">Miniatury (thumbs)</label><input class="field-input" id="THUMBS_DIR" type="text"></div>
        <div><label class="field-label">Vytištěné (printed)</label><input class="field-input" id="PRINTED_DIR" type="text"></div>
        <div><label class="field-label">Skryté (hidden)</label><input class="field-input" id="HIDDEN_DIR" type="text"></div>
      </div>
    </div>

    <!-- Save -->
    <button onclick="saveConfig()" style="background:#d4af37;color:#111;font-weight:700;border-radius:9999px;padding:0.75rem 1.5rem;width:100%;font-size:0.875rem;cursor:pointer;border:none;margin-bottom:1.5rem;">
      💾 Uložit nastavení
    </button>

    <!-- Logs -->
    <div class="section">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.75rem;flex-wrap:wrap;gap:0.5rem;">
        <span class="section-title" style="margin-bottom:0;">📋 Logy</span>
        <div style="display:flex;align-items:center;gap:0.5rem;">
          <label class="field-label" style="margin-bottom:0;">Úroveň:</label>
          <div class="custom-select-wrap" style="width:110px;">
            <div class="custom-select-display" id="log-level-display" onclick="toggleDropdown('log-level')">INFO</div>
            <div class="custom-select-dropdown" id="log-level-dropdown">
              <div class="custom-select-option" data-val="DEBUG" onclick="pickLogLevel('DEBUG')">DEBUG</div>
              <div class="custom-select-option selected" data-val="INFO" onclick="pickLogLevel('INFO')">INFO</div>
              <div class="custom-select-option" data-val="WARNING" onclick="pickLogLevel('WARNING')">WARNING</div>
              <div class="custom-select-option" data-val="ERROR" onclick="pickLogLevel('ERROR')">ERROR</div>
            </div>
          </div>
          <button class="btn-refresh" onclick="loadLogs(true)">↺</button>
          <label style="display:flex;align-items:center;gap:0.25rem;font-size:0.75rem;color:#9ca3af;cursor:pointer;">
            <input type="checkbox" id="log-autoscroll" checked style="width:12px;height:12px;"> auto-scroll
          </label>
          <label style="display:flex;align-items:center;gap:0.25rem;font-size:0.75rem;color:#9ca3af;cursor:pointer;">
            <input type="checkbox" id="log-filter-http" checked style="width:12px;height:12px;"> skrýt HTTP
          </label>
        </div>
      </div>
      <div id="log-box" style="background:#000;border-radius:0.375rem;padding:0.75rem;height:320px;overflow-y:auto;"></div>
    </div>

  </div>

  <script src="/config.js"></script>
</body>
</html>
